[package]
name = "hotpatch"
version = "0.1.0"
edition = "2024"
publish = false
description = "Dev-only Subsecond patch builder for the lab (docs/hot-patching-plan.md, A1)"

# Host tool, not part of the lab's build.
[workspace]

[dependencies]
anyhow = "1"
ar = "0.9"
object = { version = "0.37", default-features = false, features = ["read", "write", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subsecond-types = "0.7.10"

# Hashing and parsing ~70 MB of objects per patch is 10x slower unoptimised.
[profile.dev]
opt-level = 3
