[package]
name = "gpui-mobile-lab"
version = "0.1.2"
edition = "2024"
publish = false
description = "On-device test gallery for GPUI Kit v0.7.1 on Android"

[lib]
name = "gpui_mobile_lab"
crate-type = ["cdylib"]

[dependencies]
# One GPUI snapshot for everything: GPUI Kit 0.7.1 pins gpui-pre =0.3.8, and so does
# the gpui-mobile fork; [patch.crates-io] swaps in 0.3.8 with our touch fixes. Kit and gpui-mobile come from our forks, pinned by rev
# (see MOBILE_PATCHES.md for what each carries on top of upstream).
gpui = { package = "gpui-pre", version = "=0.3.8", default-features = false }
gpui-kit = { git = "https://github.com/Bombatomica64/gpui-kit", rev = "a5315a7eef624d94aec7ff7ad5ae3edf6b3b9757", default-features = false, features = ["component", "assets"] }
gpui-mobile = { package = "gpui-pre-mobile", git = "https://github.com/Bombatomica64/gpui-mobile", rev = "56043ed2470b3cedc640bd7dc5168a6d9f35aa2c", default-features = false, features = ["clipboard"] }
# Kit's FPS / frame-time HUD (enables gpui's `profiler` frame trace).
gpui-fps = { git = "https://github.com/Bombatomica64/gpui-kit", rev = "a5315a7eef624d94aec7ff7ad5ae3edf6b3b9757" }
anyhow = "1"
log = "0.4"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
jni = "0.22"
ndk = { version = "0.9", features = ["nativewindow"] }
ndk-sys = "0.6"
android-activity = { version = "0.6", features = ["native-activity"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[profile.dev]
panic = "abort"
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
gpui-pre = { git = "https://github.com/Bombatomica64/gpui-pre", rev = "7d7b9a828c864a28a9d005b2b83205763d5473cf" }

[features]
# Before/after demo builds for upstream PRs; each needs a Kit carrying that PR.
demo-pr3329 = []
