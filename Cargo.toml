[package]
name = "gpui-mobile-lab"
version = "0.1.2"
edition = "2024"
publish = false
description = "On-device test gallery for GPUI Kit v0.7.1 on Android"

[lib]
name = "gpui_mobile_lab"
crate-type = ["cdylib"]

[dependencies]
# One GPUI snapshot for everything: GPUI Kit 0.7.1 pins gpui-pre =0.3.8, and so does
# the gpui-mobile fork; [patch.crates-io] swaps in 0.3.8 with our touch fixes. Kit and gpui-mobile come from our forks, pinned by rev
# (see MOBILE_PATCHES.md for what each carries on top of upstream).
gpui = { package = "gpui-pre", version = "=0.3.8", default-features = false }
gpui-kit = { git = "https://github.com/Bombatomica64/gpui-kit", rev = "d47dd0bde03345977db286f9bc8224bf1199cb60", default-features = false, features = ["component", "assets"] }
gpui-mobile = { package = "gpui-pre-mobile", git = "https://github.com/Bombatomica64/gpui-mobile", rev = "b2d16437f4c300c9af5037e124cfd31aff26fcfd", default-features = false, features = [
    "clipboard", "share",
    # Exercised by the Platform APIs screen; build.sh copies their Java helpers from this checkout.
    "file_selector", "image_picker", "local_auth", "permission_handler", "calendar", "contacts",
    "location", "notifications", "url_launcher", "maps_launcher", "audio", "media_session",
    "microphone", "deeplink",
] }
# Kit's FPS / frame-time HUD (enables gpui's `profiler` frame trace).
gpui-fps = { git = "https://github.com/Bombatomica64/gpui-kit", rev = "d47dd0bde03345977db286f9bc8224bf1199cb60" }
anyhow = "1"
log = "0.4"
# Already in the tree through gpui; the Platform APIs screen reads picked images' sizes.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
jni = "0.22"
ndk = { version = "0.9", features = ["nativewindow"] }
ndk-sys = "0.6"
android-activity = { version = "0.6", features = ["native-activity"] }

[profile.release]
# Tuned for size, like gpui-mobile's example app: 29.5 -> 17.0 MB on arm64
# (docs/binary-size.md).
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
panic = "abort"
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
gpui-pre = { git = "https://github.com/Bombatomica64/gpui-pre", rev = "bc4b49bd280062c75b703536a9cec22585694fb3" }

[features]
# Before/after demo builds for upstream PRs; each needs a Kit carrying that PR.
demo-pr3329 = []
