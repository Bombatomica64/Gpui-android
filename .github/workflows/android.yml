# Builds the release APK (arm64-v8a) on every push to main and every PR. For an
# emulator APK, run this by hand with abi=x86_64 or all (docs/binary-size.md).
# Pushing a `v*` tag also publishes the APK on a GitHub release for that tag.
name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      abi:
        description: "ABI to build: arm64-v8a, x86_64 (emulators) or all"
        default: arm64-v8a

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install the NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.abi == 'arm64-v8a' && 'aarch64-linux-android' || inputs.abi == '' && 'aarch64-linux-android' || 'aarch64-linux-android,x86_64-linux-android' }}

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./build.sh android --release --abi "${{ inputs.abi || 'arm64-v8a' }}"

      - name: Only the app's own native library is packaged
        run: |
          # gpui-mobile also declares a cdylib; build.sh and Gradle must keep it out.
          stray=$(unzip -Z1 dist/*.apk | grep '^lib/.*\.so$' | grep -v '/libgpui_mobile_lab\.so$' || true)
          if [[ -n "$stray" ]]; then
            echo "::error::unexpected native libraries in the APK: $stray"
            exit 1
          fi

      - name: Size summary
        run: |
          apk=$(ls dist/*.apk)
          {
            echo "## APK size"
            echo
            echo "| | MB |"
            echo "|---|---:|"
            echo "| APK (download) | $(stat -c %s "$apk" | awk '{printf "%.2f", $1/1e6}') |"
            for so in android/app/src/main/jniLibs/*/*.so; do
              echo "| \`$(basename "$(dirname "$so")")\` .so | $(stat -c %s "$so" | awk '{printf "%.2f", $1/1e6}') |"
            done
            for so in android/app/src/main/jniLibs/*/*.so; do
              # The APK stays on the device and the compressed library is extracted next to it.
              echo "| Installed, \`$(basename "$(dirname "$so")")\` (APK + extracted .so) | $(( $(stat -c %s "$apk") + $(stat -c %s "$so") )) | " | awk -F'|' '{printf "|%s| %.2f |\n", $2, $3/1e6}'
            done
            echo
            echo "Largest APK entries (bytes as stored in the APK):"
            echo
            echo '```'
            unzip -lv "$apk" | sort -k3 -n -r | head -8
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: gpui-mobile-lab-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber
